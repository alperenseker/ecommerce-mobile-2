name: tstore_ecommerce_app
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # Custom Packages
  t_utils: ^0.0.4


  # Utility Packages
  gap: ^3.0.1
  dio: ^5.9.0
  uuid: ^4.5.2
  http: ^1.6.0
  intl: ^0.20.2
  lottie: ^3.3.1 # OR RIVE
  shimmer: ^3.0.0
  logger: ^2.6.2
  flutter_quill: ^11.5.0
  flutter_svg: ^2.2.2
  url_launcher: ^6.3.2
  connectivity_plus: ^6.1.2
  cached_network_image: ^3.4.1
  flutter_native_splash: ^2.4.0
  smooth_page_indicator: ^1.2.1
  country_code_picker: ^3.4.1
  otp_text_field: ^1.1.3
  animate_do: ^4.2.0
  badges: ^3.1.2


  # Icons
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.8

  # State Management
  get: ^4.7.2
  get_storage: ^2.1.1

  # Product Specific
  readmore: ^3.0.0
  carousel_slider: ^5.1.1
  flutter_rating_bar: ^4.0.1
  capped_progress_indicator: ^0.0.2

  # Notification
  flutter_local_notifications: ^19.5.0

  # Chat
  flutter_chat_ui: ^1.6.15
  flutter_chat_types: ^3.6.2
  path_provider: ^2.1.5
  signalr_netcore: ^1.3.5


  # Payment
  webview_flutter: ^4.9.0 # Halyk ePay secure payment page (hosts halyk.pay widget)

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon/splash_icon.png

  android_12:
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"
    image: assets/icon/splash_icon.png
  
# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true


  #--------------- LOCAL ASSETS ------------------#
  assets:
    - assets/logos/
    - assets/slider/
    - assets/slider2/
    - assets/language/
    - assets/images/fallback/
    - assets/images/animations/
    - assets/icons/payment_methods/
    - assets/images/on_boarding_images/

  #--------------- LOCAL FONTS ------------------#
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 800